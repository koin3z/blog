<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>データ基盤の変遷</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="920"
      data-height="230"
      class="relative h-[230px] w-[920px] overflow-hidden bg-transparent"
      role="img"
      aria-label="データウェアハウスからHadoopとHive、データレイク、レイクハウスへ進む4段階と、各段階の制約を示す図"
    >
      <svg
        class="absolute inset-0 h-full w-full text-[#64748B]"
        viewBox="0 0 920 230"
        fill="none"
        aria-hidden="true"
      >
        <path d="M143 28h190" stroke="currentColor" stroke-width="3" />
        <path d="m333 21 12 7-12 7z" fill="currentColor" />
        <path d="M365 28h190" stroke="currentColor" stroke-width="3" />
        <path d="m555 21 12 7-12 7z" fill="currentColor" />
        <path d="M587 28h190" stroke="currentColor" stroke-width="3" />
        <path d="m777 21 12 7-12 7z" fill="currentColor" />
      </svg>

      <section class="absolute top-3 left-4 grid w-[888px] grid-cols-4">
        <article class="flex min-w-0 flex-col items-center text-center">
          <div
            class="relative z-10 flex h-8 w-8 items-center justify-center rounded-full bg-[#1D4ED8] text-[18px] font-bold text-white"
            aria-hidden="true"
          >
            1
          </div>
          <div
            class="mt-2 flex h-[84px] w-[210px] flex-col items-center justify-center rounded-lg bg-[#1D4ED8] px-2.5 text-white"
          >
            <h2 class="text-[20px] leading-tight font-bold">データウェアハウス</h2>
            <p class="mt-1 text-[18px] leading-snug font-medium">履歴を集約して大規模集計</p>
          </div>
          <aside
            class="mt-2 flex h-[72px] w-[210px] items-center justify-center rounded-lg border border-[#60A5FA] bg-[#DBEAFE] px-3 text-[18px] leading-snug font-medium text-[#1E3A8A]"
          >
            ストレージと処理が密結合
          </aside>
        </article>

        <article class="flex min-w-0 flex-col items-center text-center">
          <div
            class="relative z-10 flex h-8 w-8 items-center justify-center rounded-full bg-[#047857] text-[18px] font-bold text-white"
            aria-hidden="true"
          >
            2
          </div>
          <div
            class="mt-2 flex h-[84px] w-[210px] flex-col items-center justify-center rounded-lg bg-[#047857] px-2.5 text-white"
          >
            <h2 class="text-[20px] leading-tight font-bold">Hadoop / Hive</h2>
            <p class="mt-1 text-[18px] leading-snug font-medium">分散保存とSQLの入口</p>
          </div>
          <aside
            class="mt-2 flex h-[72px] w-[210px] items-center justify-center rounded-lg border border-[#5EEAD4] bg-[#CCFBF1] px-3 text-[18px] leading-snug font-medium text-[#134E4A]"
          >
            表の状態をディレクトリに依存
          </aside>
        </article>

        <article class="flex min-w-0 flex-col items-center text-center">
          <div
            class="relative z-10 flex h-8 w-8 items-center justify-center rounded-full bg-[#B45309] text-[18px] font-bold text-white"
            aria-hidden="true"
          >
            3
          </div>
          <div
            class="mt-2 flex h-[84px] w-[210px] flex-col items-center justify-center rounded-lg bg-[#B45309] px-2.5 text-white"
          >
            <h2 class="text-[20px] leading-tight font-bold">データレイク</h2>
            <p class="mt-1 text-[18px] leading-snug font-medium">多様な形式を安価に保存</p>
          </div>
          <aside
            class="mt-2 flex h-[72px] w-[210px] items-center justify-center rounded-lg border border-[#FDBA74] bg-[#FFEDD5] px-3 text-[18px] leading-snug font-medium text-[#78350F]"
          >
            更新ルールがエンジンごとに分散
          </aside>
        </article>

        <article class="flex min-w-0 flex-col items-center text-center">
          <div
            class="relative z-10 flex h-8 w-8 items-center justify-center rounded-full bg-[#6D28D9] text-[18px] font-bold text-white"
            aria-hidden="true"
          >
            4
          </div>
          <div
            class="mt-2 flex h-[84px] w-[210px] flex-col items-center justify-center rounded-lg bg-[#6D28D9] px-2.5 text-white"
          >
            <h2 class="text-[20px] leading-tight font-bold">レイクハウス</h2>
            <p class="mt-1 text-[18px] leading-snug font-medium">表の状態と履歴を管理</p>
          </div>
          <aside
            class="mt-2 flex h-[72px] w-[210px] items-center justify-center rounded-lg border border-[#C4B5FD] bg-[#EDE9FE] px-3 text-[18px] leading-snug font-medium text-[#4C1D95]"
          >
            SQL・認可・カタログ差は残る
          </aside>
        </article>
      </section>
    </main>
  </body>
</html>
