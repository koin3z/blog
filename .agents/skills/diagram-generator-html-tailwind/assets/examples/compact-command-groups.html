<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>名前空間の操作グループ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="900"
      data-height="260"
      class="relative h-[260px] w-[900px] overflow-hidden bg-transparent p-5"
      role="img"
      aria-label="基本操作、名前空間の操作、確認コマンドの3グループと、それぞれの代表例を示す図"
    >
      <section class="grid h-full grid-cols-3 gap-5">
        <article class="flex min-w-0 flex-col rounded-2xl bg-[#1E40AF] px-4 py-4 text-white">
          <h2 class="text-center text-[18px] leading-tight font-bold">基本操作</h2>
          <div class="mt-4 grid gap-3">
            <div
              class="flex h-[60px] items-center justify-center rounded-xl bg-[#1D4ED8] px-3 text-center text-[16px] leading-snug font-medium"
            >
              マウント
            </div>
            <div
              class="flex h-[60px] items-center justify-center rounded-xl bg-[#1D4ED8] px-3 text-center text-[16px] leading-snug font-medium"
            >
              バインドマウント
            </div>
          </div>
        </article>

        <article class="flex min-w-0 flex-col rounded-2xl bg-[#5B21B6] px-4 py-4 text-white">
          <h2 class="text-center text-[18px] leading-tight font-bold">名前空間の操作</h2>
          <div class="mt-4 grid gap-3">
            <div
              class="flex h-[60px] items-center justify-center rounded-xl bg-[#6D28D9] px-3 text-center text-[16px] leading-snug font-medium"
            >
              mount namespace
            </div>
            <div
              class="flex h-[60px] items-center justify-center rounded-xl bg-[#6D28D9] px-3 text-center text-[16px] leading-snug font-medium"
            >
              PID namespace
            </div>
          </div>
        </article>

        <article class="flex min-w-0 flex-col rounded-2xl bg-[#065F46] px-4 py-4 text-white">
          <h2 class="text-center text-[18px] leading-tight font-bold">確認コマンド</h2>
          <div class="mt-4 grid gap-3">
            <div
              class="flex h-[60px] items-center justify-center rounded-xl bg-[#047857] px-3 text-center text-[16px] leading-snug font-medium"
            >
              findmnt
            </div>
            <div
              class="flex h-[60px] items-center justify-center rounded-xl bg-[#047857] px-3 text-center text-[16px] leading-snug font-medium"
            >
              lsns
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
