<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3層アーキテクチャ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="860"
      data-height="470"
      class="relative h-[470px] w-[860px] overflow-hidden bg-transparent p-7"
      role="img"
      aria-label="Presentation、Application、Dataの3層と、上位層から下位層への依存方向を示す図"
    >
      <section class="flex h-full flex-col justify-center">
        <article
          class="grid h-[110px] grid-cols-[190px_1fr] items-center rounded-2xl border-2 border-[#60A5FA] bg-[#1E40AF] px-6 py-4 text-white"
        >
          <div>
            <h2 class="text-[21px] leading-tight font-bold">Presentation</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium">入力と表示</p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <span
              class="flex h-[54px] items-center justify-center rounded-xl bg-[#1D4ED8] px-4 text-center text-[16px] leading-snug font-medium text-white"
              >Web UI</span
            >
            <span
              class="flex h-[54px] items-center justify-center rounded-xl bg-[#1D4ED8] px-4 text-center text-[16px] leading-snug font-medium text-white"
              >API Controller</span
            >
          </div>
        </article>

        <div class="flex h-[34px] items-center justify-center" aria-hidden="true">
          <svg class="h-7 w-7 text-[#B45309]" viewBox="0 0 28 28" fill="none">
            <path d="M14 3v15" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <path d="m8 15 6 8 6-8z" fill="currentColor" />
          </svg>
        </div>

        <article
          class="grid h-[110px] grid-cols-[190px_1fr] items-center rounded-2xl border-2 border-[#A78BFA] bg-[#5B21B6] px-6 py-4 text-white"
        >
          <div>
            <h2 class="text-[21px] leading-tight font-bold">Application</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium">業務ルール</p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <span
              class="flex h-[54px] items-center justify-center rounded-xl bg-[#6D28D9] px-4 text-center text-[16px] leading-snug font-medium text-white"
              >Use Case</span
            >
            <span
              class="flex h-[54px] items-center justify-center rounded-xl bg-[#6D28D9] px-4 text-center text-[16px] leading-snug font-medium text-white"
              >Domain Service</span
            >
          </div>
        </article>

        <div class="flex h-[34px] items-center justify-center" aria-hidden="true">
          <svg class="h-7 w-7 text-[#B45309]" viewBox="0 0 28 28" fill="none">
            <path d="M14 3v15" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <path d="m8 15 6 8 6-8z" fill="currentColor" />
          </svg>
        </div>

        <article
          class="grid h-[110px] grid-cols-[190px_1fr] items-center rounded-2xl border-2 border-[#5EEAD4] bg-[#065F46] px-6 py-4 text-white"
        >
          <div>
            <h2 class="text-[21px] leading-tight font-bold">Data</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium">状態の永続化</p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <span
              class="flex h-[54px] items-center justify-center rounded-xl bg-[#047857] px-4 text-center text-[16px] leading-snug font-medium text-white"
              >Repository</span
            >
            <span
              class="flex h-[54px] items-center justify-center rounded-xl bg-[#047857] px-4 text-center text-[16px] leading-snug font-medium text-white"
              >Database</span
            >
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
