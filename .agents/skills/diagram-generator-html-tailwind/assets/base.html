<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compact technical diagram</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="760"
      data-height="150"
      class="relative h-[150px] w-[760px] overflow-hidden bg-transparent"
      role="img"
      aria-label="入力、処理、出力の3段階を左から右へ示す図"
    >
      <!-- diagram-content -->
      <section class="relative h-full w-full" aria-label="処理の流れ">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 760 150"
          fill="none"
          aria-hidden="true"
        >
          <path d="M147 42h206" stroke="currentColor" stroke-width="3" />
          <path d="m352 35 11 7-11 7z" fill="currentColor" />
          <path d="M397 42h206" stroke="currentColor" stroke-width="3" />
          <path d="m602 35 11 7-11 7z" fill="currentColor" />
        </svg>

        <div
          class="absolute top-[25px] left-[113px] flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#1D4ED8] text-[16px] font-bold text-white"
          aria-hidden="true"
        >
          1
        </div>
        <article class="absolute top-[76px] left-[40px] w-[180px] text-center">
          <div class="rounded-xl bg-[#1D4ED8] px-3 py-2 text-white">
            <h2 class="text-[20px] leading-tight font-bold">入力</h2>
            <p class="mt-1.5 text-[16px] leading-snug font-medium">受け取る情報</p>
          </div>
        </article>

        <div
          class="absolute top-[25px] left-[363px] flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#047857] text-[16px] font-bold text-white"
          aria-hidden="true"
        >
          2
        </div>
        <article class="absolute top-[76px] left-[290px] w-[180px] text-center">
          <div class="rounded-xl bg-[#047857] px-3 py-2 text-white">
            <h2 class="text-[20px] leading-tight font-bold">処理</h2>
            <p class="mt-1.5 text-[16px] leading-snug font-medium">意味を変換する</p>
          </div>
        </article>

        <div
          class="absolute top-[25px] left-[613px] flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#6D28D9] text-[16px] font-bold text-white"
          aria-hidden="true"
        >
          3
        </div>
        <article class="absolute top-[76px] left-[540px] w-[180px] text-center">
          <div class="rounded-xl bg-[#6D28D9] px-3 py-2 text-white">
            <h2 class="text-[20px] leading-tight font-bold">出力</h2>
            <p class="mt-1.5 text-[16px] leading-snug font-medium">結果を渡す</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
