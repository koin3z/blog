<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous AI Database workload auto replay flow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="960"
      data-height="365"
      class="relative h-[365px] w-[960px] overflow-hidden bg-transparent"
      role="img"
      aria-label="Regularの本番DatabaseでWorkload Auto Replayを有効化し、指定時間のWorkloadをCaptureする。EarlyのRefreshable Cloneへの次回週次パッチ適用後に自動Replayし、Status、History、Replay Reportを確認する。機能を無効化するまで週次で繰り返す流れ"
    >
      <section class="relative h-full w-full" aria-label="Workload Auto Replayの週次フロー">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 960 365"
          fill="none"
          aria-hidden="true"
        >
          <path d="M184 154h18" stroke="currentColor" stroke-width="3" />
          <path d="m201 147 11 7-11 7z" fill="currentColor" />
          <path d="M374 154h18" stroke="currentColor" stroke-width="3" />
          <path d="m391 147 11 7-11 7z" fill="currentColor" />
          <path d="M564 154h18" stroke="currentColor" stroke-width="3" />
          <path d="m581 147 11 7-11 7z" fill="currentColor" />
          <path d="M754 154h18" stroke="currentColor" stroke-width="3" />
          <path d="m771 147 11 7-11 7z" fill="currentColor" />

          <path
            d="M867 248v39c0 20-16 36-36 36H307c-20 0-36-16-36-36v-27"
            stroke="#2563EB"
            stroke-width="3"
            stroke-dasharray="8 7"
          />
          <path d="m264 261 7-12 7 12z" fill="#2563EB" />
        </svg>

        <div
          class="absolute top-[10px] left-[22px] rounded-lg border border-[#F59E0B] bg-[#FFFBEB] px-4 py-1.5 text-[18px] leading-tight font-bold text-[#92400E]"
        >
          Refreshable Cloneを作成しただけでは開始しない
        </div>

        <article
          class="absolute top-[60px] left-[22px] h-[188px] w-[162px] rounded-2xl border-2 border-[#60A5FA] bg-[#EFF6FF] px-4 py-4 text-[#1E3A8A]"
        >
          <div
            class="inline-flex rounded-full bg-[#1D4ED8] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            事前設定
          </div>
          <h2 class="mt-3 text-[21px] leading-tight font-bold">機能を有効化</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">Target OCIDで1対1に紐づけ</p>
        </article>

        <article
          class="absolute top-[60px] left-[212px] h-[188px] w-[162px] rounded-2xl border-2 border-[#60A5FA] bg-[#DBEAFE] px-4 py-4 text-[#1E3A8A]"
        >
          <div
            class="inline-flex rounded-full bg-[#1D4ED8] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            REGULAR
          </div>
          <h2 class="mt-3 text-[21px] leading-tight font-bold">本番Capture</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">指定時間のWorkloadを記録</p>
        </article>

        <article
          class="absolute top-[60px] left-[402px] h-[188px] w-[162px] rounded-2xl border-2 border-[#2DD4BF] bg-[#CCFBF1] px-4 py-4 text-[#134E4A]"
        >
          <div
            class="inline-flex rounded-full bg-[#047857] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            EARLY
          </div>
          <h2 class="mt-3 text-[21px] leading-tight font-bold">Patchを待つ</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">Targetに次回週次Patchを先行適用</p>
        </article>

        <article
          class="absolute top-[60px] left-[592px] h-[188px] w-[162px] rounded-2xl border-2 border-[#2DD4BF] bg-[#CCFBF1] px-4 py-4 text-[#134E4A]"
        >
          <div
            class="inline-flex rounded-full bg-[#047857] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            EARLY
          </div>
          <h2 class="mt-3 text-[21px] leading-tight font-bold">自動Replay</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">Timing・並行性・依存を再現</p>
        </article>

        <article
          class="absolute top-[60px] left-[782px] h-[188px] w-[156px] rounded-2xl border-2 border-[#94A3B8] bg-[#F8FAFC] px-4 py-4 text-[#334155]"
        >
          <div
            class="inline-flex rounded-full bg-[#475569] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            確認
          </div>
          <h2 class="mt-3 text-[21px] leading-tight font-bold">差分を確認</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">Status・History・Replay Report</p>
        </article>

        <div
          class="absolute top-[296px] left-[447px] rounded-lg bg-[#DBEAFE] px-4 py-1.5 text-[18px] leading-tight font-bold text-[#1E3A8A]"
        >
          無効化するまで毎週繰り返す
        </div>
      </section>
    </main>
  </body>
</html>
