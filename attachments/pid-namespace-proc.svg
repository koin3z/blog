<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%">
<style>text{font-family:sans-serif;}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="250" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#B4B2A9">PID namespace のみ作成</text>

<rect x="100" y="50" width="300" height="65" rx="14" fill="#444441"/>
<text x="250" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#D3D1C7">新しい PID namespace</text>
<line x1="250" y1="115" x2="250" y2="152" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="100" y="155" width="300" height="75" rx="14" fill="#791F1F"/>
<text x="250" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#F7C1C1">/proc</text>
<text x="250" y="210" text-anchor="middle" font-size="12" fill="#F09595">元の namespace を参照</text>
<line x1="250" y1="230" x2="250" y2="267" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="100" y="270" width="300" height="85" rx="14" fill="#791F1F"/>
<text x="250" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#F7C1C1">ps -ef</text>
<text x="250" y="328" text-anchor="middle" font-size="12" fill="#F09595">元の namespace 全体を表示</text>

<text x="750" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#B4B2A9">PID + mount namespace</text>
<text x="750" y="40" text-anchor="middle" font-size="12" fill="#888780">+ --mount-proc</text>

<rect x="600" y="50" width="300" height="65" rx="14" fill="#444441"/>
<text x="750" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#D3D1C7">新しい PID namespace</text>
<line x1="750" y1="115" x2="750" y2="152" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="600" y="155" width="300" height="75" rx="14" fill="#085041"/>
<text x="750" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#9FE1CB">/proc</text>
<text x="750" y="210" text-anchor="middle" font-size="12" fill="#5DCAA5">新規にマウントし直す</text>
<line x1="750" y1="230" x2="750" y2="267" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="600" y="270" width="300" height="85" rx="14" fill="#0C447C"/>
<text x="750" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#B5D4F4">ps -ef</text>
<text x="750" y="328" text-anchor="middle" font-size="12" fill="#85B7EB">新namespaceに閉じて表示</text>
</svg>
