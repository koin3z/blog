<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%">
<style>text{font-family:sans-serif;}</style>

<rect x="350" y="40" width="300" height="80" rx="16" fill="#444441"/>
<text x="500" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#D3D1C7">カーネルが保持する</text>
<text x="500" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#D3D1C7">実際のマウント構成</text>

<line x1="480" y1="120" x2="255" y2="176" stroke="#888780" stroke-width="1.5"/>
<line x1="520" y1="120" x2="745" y2="176" stroke="#888780" stroke-width="1.5"/>

<rect x="60" y="180" width="380" height="200" rx="20" fill="#085041"/>
<text x="250" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#9FE1CB">mount namespace A(元)</text>
<rect x="90" y="240" width="150" height="55" rx="12" fill="#0F6E56"/>
<text x="165" y="273" text-anchor="middle" font-size="15" fill="#9FE1CB">プロセス1</text>
<rect x="260" y="240" width="150" height="55" rx="12" fill="#0F6E56"/>
<text x="335" y="273" text-anchor="middle" font-size="15" fill="#9FE1CB">プロセス2</text>
<text x="250" y="330" text-anchor="middle" font-size="12" fill="#5DCAA5">同じマウント構成を共有</text>

<rect x="560" y="180" width="380" height="200" rx="20" fill="#3C3489"/>
<text x="750" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#CECBF6">mount namespace B(unshare後)</text>
<rect x="675" y="240" width="150" height="55" rx="12" fill="#534AB7"/>
<text x="750" y="273" text-anchor="middle" font-size="15" fill="#CECBF6">プロセス3</text>
<text x="750" y="330" text-anchor="middle" font-size="12" fill="#AFA9EC">変更はAに伝播しない</text>
</svg>
