<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous AI Database Early and Regular patch timeline</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="920"
      data-height="340"
      class="relative h-[340px] w-[920px] overflow-hidden bg-transparent"
      role="img"
      aria-label="週NにEarlyの検証DatabaseへPatch Pを先行適用し、1週間の検証、Workload Replay、Service Requestを経て、問題がなければ週N+1にRegularの本番Databaseへ適用候補となる通常サイクル。1週間は利用者がRegularを延期できる期間ではなく、Critical security fixは通常順序外で適用される"
    >
      <section class="relative h-full w-full" aria-label="EarlyからRegularへの通常タイムライン">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 920 340"
          fill="none"
          aria-hidden="true"
        >
          <path d="M280 120h42" stroke="currentColor" stroke-width="3" />
          <path d="m321 113 12 7-12 7z" fill="currentColor" />
          <path d="M587 120h41" stroke="currentColor" stroke-width="3" />
          <path d="m627 113 12 7-12 7z" fill="currentColor" />
        </svg>

        <article
          class="absolute top-[50px] left-[30px] flex h-[140px] w-[250px] flex-col justify-center rounded-2xl border-2 border-[#60A5FA] bg-[#DBEAFE] px-6 text-[#1E3A8A]"
        >
          <div
            class="w-fit rounded-full bg-[#1D4ED8] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            EARLY
          </div>
          <h2 class="mt-3 text-[23px] leading-tight font-bold">週N：Patch P</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">検証環境へ先行適用</p>
        </article>

        <article
          class="absolute top-[72px] left-[333px] flex h-[96px] w-[254px] flex-col items-center justify-center rounded-xl border-2 border-[#F59E0B] bg-[#FFEDD5] px-4 text-center text-[#78350F]"
        >
          <h2 class="text-[25px] leading-tight font-bold">1週間</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">検証／Replay／SR</p>
        </article>

        <article
          class="absolute top-[50px] left-[639px] flex h-[140px] w-[251px] flex-col justify-center rounded-2xl border-2 border-[#2DD4BF] bg-[#CCFBF1] px-6 text-[#134E4A]"
        >
          <div
            class="w-fit rounded-full bg-[#047857] px-3 py-1 text-[18px] leading-tight font-bold text-white"
          >
            REGULAR
          </div>
          <h2 class="mt-3 text-[23px] leading-tight font-bold">週N+1：Patch P</h2>
          <p class="mt-2 text-[18px] leading-snug font-medium">問題がなければ本番適用</p>
        </article>

        <aside
          class="absolute top-[215px] left-[148px] flex h-[52px] w-[624px] items-center justify-center rounded-xl border-2 border-[#A78BFA] bg-[#EDE9FE] px-5 text-center text-[18px] leading-snug font-bold text-[#4C1D95]"
        >
          問題を報告すると、Oracleが修正、無効化、Regularの一時停止を判断する
        </aside>

        <aside
          class="absolute top-[281px] left-[190px] flex h-[42px] w-[540px] items-center justify-center rounded-lg border border-[#FB7185] bg-[#FFE4E6] px-4 text-center text-[18px] leading-tight font-bold text-[#881337]"
        >
          Critical security fixは通常順序外：利用可能になり次第適用
        </aside>
      </section>
    </main>
  </body>
</html>
