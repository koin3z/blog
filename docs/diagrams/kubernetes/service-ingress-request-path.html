<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kubernetes Service と Ingress の通信経路</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="980"
      data-height="480"
      class="relative h-[480px] w-[980px] overflow-hidden bg-transparent"
      role="img"
      aria-label="外部クライアントからのHTTPまたはHTTPS通信がIngress controller、Serviceを経由して複数のPodへ届く経路と、Ingress resourceがcontrollerへ経路設定を反映する関係を示す図"
    >
      <section class="relative h-full w-full" aria-label="Service と Ingress の通信経路">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 980 480"
          fill="none"
          aria-hidden="true"
        >
          <path d="M240 281h54" stroke="currentColor" stroke-width="3" />
          <path d="m284 274 13 7-13 7z" fill="currentColor" />
          <path d="M516 281h74" stroke="currentColor" stroke-width="3" />
          <path d="m580 274 13 7-13 7z" fill="currentColor" />
          <path d="M730 281h71" stroke="currentColor" stroke-width="3" />
          <path d="m791 274 13 7-13 7z" fill="currentColor" />
          <path d="M797 281h38v-80" stroke="currentColor" stroke-width="3" />
          <path d="m828 211 7-13 7 13z" fill="currentColor" />
          <path d="M797 281h38v80" stroke="currentColor" stroke-width="3" />
          <path d="m828 351 7 13 7-13z" fill="currentColor" />
          <path d="M407 154v61" stroke="#0F766E" stroke-width="3" stroke-dasharray="7 7" />
          <path d="m400 205 7 13 7-13z" fill="#0F766E" />
        </svg>

        <article class="absolute top-[233px] left-[20px] w-[220px] text-center">
          <div class="rounded-2xl border-2 border-[#1D4ED8] bg-[#DBEAFE] px-4 py-4 text-[#1E3A8A]">
            <h2 class="text-[22px] leading-tight font-bold">外部クライアント</h2>
            <p class="mt-2 text-[17px] leading-snug font-medium">HTTP / HTTPS</p>
          </div>
        </article>

        <section
          class="absolute top-[28px] left-[250px] h-[424px] w-[702px] rounded-2xl border-2 border-dashed border-[#60A5FA]"
          aria-label="Kubernetes クラスター"
        >
          <div
            class="absolute top-[-17px] left-[22px] rounded-lg bg-[#DBEAFE] px-3 py-1 text-[16px] leading-tight font-bold text-[#1E3A8A]"
          >
            Kubernetes クラスター
          </div>

          <article class="absolute top-[28px] left-[44px] w-[226px] text-center">
            <div class="rounded-xl border-2 border-[#0F766E] bg-[#CCFBF1] px-4 py-3 text-[#134E4A]">
              <h2 class="text-[21px] leading-tight font-bold">Ingress resource</h2>
              <p class="mt-1.5 text-[16px] leading-snug font-medium">ホスト名・URLパスの規則</p>
            </div>
          </article>

          <article class="absolute top-[187px] left-[44px] w-[222px] text-center">
            <div class="rounded-2xl bg-[#047857] px-4 py-4 text-white">
              <h2 class="text-[22px] leading-tight font-bold">Ingress controller</h2>
              <p class="mt-2 text-[17px] leading-snug font-medium">経路を実装する</p>
            </div>
          </article>

          <article class="absolute top-[187px] left-[338px] w-[140px] text-center">
            <div class="rounded-2xl bg-[#1D4ED8] px-4 py-4 text-white">
              <h2 class="text-[22px] leading-tight font-bold">Service</h2>
              <p class="mt-2 text-[16px] leading-snug font-medium">安定した接続先</p>
            </div>
          </article>

          <section class="absolute top-[102px] left-[550px] h-[258px] w-[122px]" aria-label="selector に一致する Pod 群">
            <div
            class="absolute top-[-50px] left-[-16px] w-[154px] rounded-lg bg-[#EDE9FE] px-2 py-1 text-[16px] leading-tight font-bold text-[#4C1D95]"
            >
              selectorに一致
            </div>
            <article class="absolute top-[18px] left-0 w-[122px] text-center">
              <div class="rounded-xl border-2 border-[#7C3AED] bg-[#EDE9FE] px-3 py-3 text-[#4C1D95]">
                <h2 class="text-[20px] leading-tight font-bold">Pod</h2>
              </div>
            </article>
            <article class="absolute top-[98px] left-0 w-[122px] text-center">
              <div class="rounded-xl border-2 border-[#7C3AED] bg-[#EDE9FE] px-3 py-3 text-[#4C1D95]">
                <h2 class="text-[20px] leading-tight font-bold">Pod</h2>
              </div>
            </article>
            <article class="absolute top-[178px] left-0 w-[122px] text-center">
              <div class="rounded-xl border-2 border-[#7C3AED] bg-[#EDE9FE] px-3 py-3 text-[#4C1D95]">
                <h2 class="text-[20px] leading-tight font-bold">Pod</h2>
              </div>
            </article>
          </section>
        </section>

        <div
          class="absolute top-[173px] left-[581px] rounded-lg bg-[#CCFBF1] px-3 py-1 text-[16px] leading-tight font-bold text-[#134E4A]"
        >
          host / path で振り分け
        </div>
        <div
          class="absolute top-[166px] left-[331px] rounded-lg bg-[#CCFBF1] px-3 py-1 text-[16px] leading-tight font-bold text-[#134E4A]"
        >
          設定を反映
        </div>
      </section>
    </main>
  </body>
</html>
