<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZRCV redo gap recovery flow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="920"
      data-height="400"
      class="relative h-[400px] w-[920px] overflow-hidden bg-transparent"
      role="img"
      aria-label="ZRCVのREDOストリームが中断したとき、受信済みREDOを部分アーカイブログとして保護し、再接続後に不足するアーカイブログを取得してギャップを解消する流れ"
    >
      <section class="relative h-full w-full" aria-label="REDO転送中断時の処理">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 920 400"
          fill="none"
          aria-hidden="true"
        >
          <path d="M214 96h34" stroke="currentColor" stroke-width="3" />
          <path d="m247 88 13 8-13 8z" fill="currentColor" />
          <path d="M441 96h34" stroke="currentColor" stroke-width="3" />
          <path d="m474 88 13 8-13 8z" fill="currentColor" />
          <path d="M668 96h34" stroke="currentColor" stroke-width="3" />
          <path d="m701 88 13 8-13 8z" fill="currentColor" />
        </svg>

        <article class="absolute top-[38px] left-[22px] w-[192px] text-center">
          <div
            class="flex h-[182px] flex-col items-center rounded-xl border-2 border-[#1E3A8A] bg-[#1D4ED8] px-4 py-4 text-white"
          >
            <div
              class="mx-auto flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#DBEAFE] text-[16px] font-bold text-[#1E3A8A]"
            >
              1
            </div>
            <h2 class="mt-3 text-[20px] leading-tight font-bold">継続転送</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium text-blue-100">
              生成されたREDOを受信
            </p>
          </div>
          <p
            class="mt-3 rounded-lg bg-[#DBEAFE] px-3 py-2 text-[16px] leading-snug font-bold text-[#1E3A8A]"
          >
            通常経路
          </p>
        </article>

        <article class="absolute top-[38px] left-[249px] w-[192px] text-center">
          <div
            class="flex h-[182px] flex-col items-center rounded-xl border-2 border-[#881337] bg-[#BE123C] px-4 py-4 text-white"
          >
            <div
              class="mx-auto flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#FFE4E6] text-[16px] font-bold text-[#881337]"
            >
              2
            </div>
            <h2 class="mt-3 text-[20px] leading-tight font-bold">ストリーム中断</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium text-rose-100">
              DB障害または通信断
            </p>
          </div>
          <p
            class="mt-3 rounded-lg bg-[#FFE4E6] px-3 py-2 text-[16px] leading-snug font-bold text-[#881337]"
          >
            最終受信位置が境界
          </p>
        </article>

        <article class="absolute top-[38px] left-[476px] w-[192px] text-center">
          <div
            class="flex h-[182px] flex-col items-center rounded-xl border-2 border-[#78350F] bg-[#B45309] px-4 py-4 text-white"
          >
            <div
              class="mx-auto flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#FFEDD5] text-[16px] font-bold text-[#78350F]"
            >
              3
            </div>
            <h2 class="mt-3 text-[20px] leading-tight font-bold">部分ログを作成</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium text-orange-100">
              受信済みREDOを保護
            </p>
          </div>
          <p
            class="mt-3 rounded-lg bg-[#FFEDD5] px-3 py-2 text-[16px] leading-snug font-bold text-[#78350F]"
          >
            受信済み変更まで復旧可能
          </p>
        </article>

        <article class="absolute top-[38px] left-[703px] w-[195px] text-center">
          <div
            class="flex h-[182px] flex-col items-center rounded-xl border-2 border-[#134E4A] bg-[#047857] px-4 py-4 text-white"
          >
            <div
              class="mx-auto flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[#CCFBF1] text-[16px] font-bold text-[#134E4A]"
            >
              4
            </div>
            <h2 class="mt-3 text-[20px] leading-tight font-bold">再接続とGap Fetch</h2>
            <p class="mt-2 text-[16px] leading-snug font-medium text-teal-100">
              不足アーカイブログを取得
            </p>
          </div>
          <p
            class="mt-3 rounded-lg bg-[#CCFBF1] px-3 py-2 text-[16px] leading-snug font-bold text-[#134E4A]"
          >
            ギャップ解消を確認
          </p>
        </article>

        <div
          class="absolute top-[315px] left-[22px] flex w-[876px] items-center gap-3 rounded-xl border border-violet-300 bg-[#EDE9FE] px-4 py-2 text-[#4C1D95]"
        >
          <span
            class="shrink-0 whitespace-nowrap rounded-md bg-[#6D28D9] px-2 py-1 text-[16px] font-bold text-white"
            >監視</span
          >
          <p class="text-[16px] leading-snug font-bold">
            自動補完を前提に放置せず、HealthとDataLossExposureで保護状態を確認する
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
