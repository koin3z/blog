<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bind mount による同一 inode への複数パス</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="860"
      data-height="280"
      class="relative h-[280px] w-[860px] overflow-hidden bg-transparent"
      role="img"
      aria-label="bind mountではsourceとtargetの異なるパスが同じinodeとデータを参照し、ファイルのコピーは作られないことを示す図"
    >
      <section class="relative h-full w-full" aria-label="bind mountの参照関係">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 860 280"
          fill="none"
          aria-hidden="true"
        >
          <path d="M226 82 354 133" stroke="currentColor" stroke-width="3" />
          <path d="m344 122 13 10-17 3z" fill="currentColor" />
          <path d="M634 82 506 133" stroke="currentColor" stroke-width="3" />
          <path d="m516 122-13 10 17 3z" fill="currentColor" />
        </svg>

        <article class="absolute top-[38px] left-[38px] w-[190px] text-center">
          <div class="rounded-2xl border-2 border-[#60A5FA] bg-[#DBEAFE] px-4 py-4 text-[#1E3A8A]">
            <p class="text-[16px] font-bold">元のパス</p>
            <h2 class="mt-2 font-mono text-[20px] leading-tight font-bold">source/HELLO</h2>
          </div>
        </article>

        <article class="absolute top-[38px] left-[632px] w-[190px] text-center">
          <div class="rounded-2xl border-2 border-[#2DD4BF] bg-[#CCFBF1] px-4 py-4 text-[#134E4A]">
            <p class="text-[16px] font-bold">別のパス</p>
            <h2 class="mt-2 font-mono text-[20px] leading-tight font-bold">target/HELLO</h2>
          </div>
        </article>

        <article class="absolute top-[136px] left-[286px] w-[288px] text-center">
          <div class="rounded-2xl bg-[#6D28D9] px-5 py-4 text-white">
            <h2 class="text-[22px] leading-tight font-bold">同じ inode とデータ</h2>
            <p class="mt-2 text-[17px] leading-snug font-medium">変更は両方のパスから見える</p>
          </div>
        </article>

        <div
          class="absolute top-[229px] left-[311px] rounded-lg bg-[#EDE9FE] px-3 py-1 text-[16px] font-bold text-[#4C1D95]"
        >
          コピーは作られない
        </div>
      </section>
    </main>
  </body>
</html>
