<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mount によるソースとマウントポイントの接続</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="920"
      data-height="320"
      class="relative h-[320px] w-[920px] overflow-hidden bg-transparent"
      role="img"
      aria-label="/dev/sda1上のext4ファイルシステムをマウントすると、マウントポイントであるルートディレクトリを起点とするLinuxのディレクトリツリーから到達できることを示す図"
    >
      <section class="relative h-full w-full" aria-label="mount による接続">
        <svg
          class="absolute inset-0 h-full w-full text-[#64748B]"
          viewBox="0 0 920 320"
          fill="none"
          aria-hidden="true"
        >
          <path d="M250 160h116" stroke="currentColor" stroke-width="3" />
          <path d="m356 153 13 7-13 7z" fill="currentColor" />
        </svg>

        <article class="absolute top-[94px] left-[28px] w-[222px] text-center">
          <div class="rounded-2xl border-2 border-[#60A5FA] bg-[#DBEAFE] px-5 py-5 text-[#1E3A8A]">
            <p class="text-[16px] font-bold">ソース</p>
            <h2 class="mt-2 font-mono text-[23px] leading-tight font-bold">/dev/sda1</h2>
            <p class="mt-2 text-[17px] leading-snug font-medium">ext4 ファイルシステム</p>
          </div>
        </article>

        <div
          class="absolute top-[109px] left-[287px] rounded-lg bg-[#DBEAFE] px-3 py-1 text-[16px] font-bold text-[#1E3A8A]"
        >
          mount
        </div>

        <section
          class="absolute top-[30px] left-[360px] h-[260px] w-[530px] rounded-2xl border-2 border-dashed border-[#2DD4BF]"
          aria-label="Linuxのディレクトリツリー"
        >
          <div
            class="absolute top-[-17px] left-[20px] rounded-lg bg-[#CCFBF1] px-3 py-1 text-[16px] font-bold text-[#134E4A]"
          >
            Linux のディレクトリツリー
          </div>
          <article class="absolute top-[45px] left-[38px] w-[180px] text-center">
            <div class="rounded-xl bg-[#047857] px-4 py-4 text-white">
              <h2 class="font-mono text-[26px] leading-tight font-bold">/</h2>
              <p class="mt-1 text-[16px] leading-snug font-medium">マウントポイント</p>
            </div>
          </article>
          <svg
            class="absolute top-[106px] left-[218px] h-[96px] w-[94px] text-[#64748B]"
            viewBox="0 0 94 96"
            fill="none"
            aria-hidden="true"
          >
            <path d="M4 48h36v-30h30M40 48v30h30" stroke="currentColor" stroke-width="3" />
          </svg>
          <article class="absolute top-[30px] left-[270px] w-[202px] text-center">
            <div class="rounded-xl border-2 border-[#60A5FA] bg-[#DBEAFE] px-3 py-3 text-[#1E3A8A]">
              <h2 class="font-mono text-[20px] leading-tight font-bold">/dev</h2>
              <p class="mt-1 text-[16px] leading-snug font-medium">devtmpfs</p>
            </div>
          </article>
          <article class="absolute top-[139px] left-[270px] w-[202px] text-center">
            <div class="rounded-xl border-2 border-[#7C3AED] bg-[#EDE9FE] px-3 py-3 text-[#4C1D95]">
              <h2 class="font-mono text-[20px] leading-tight font-bold">/proc</h2>
              <p class="mt-1 text-[16px] leading-snug font-medium">proc</p>
            </div>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
