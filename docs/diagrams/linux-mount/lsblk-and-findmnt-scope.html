<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lsblk と findmnt の対象範囲</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        font-family:
          "Avenir Next", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden bg-transparent p-0 text-slate-900 antialiased">
    <div id="tailwind-probe" class="hidden" aria-hidden="true"></div>
    <main
      id="diagram"
      data-width="900"
      data-height="350"
      class="relative h-[350px] w-[900px] overflow-hidden bg-transparent"
      role="img"
      aria-label="lsblkはブロックデバイスとパーティションの構成を、findmntはマウントポイントとソースの対応を示す。procのような疑似ファイルシステムはfindmntには現れるがlsblkの対象ではないことを示す図"
    >
      <section class="relative h-full w-full" aria-label="lsblkとfindmntの比較">
        <article
          class="absolute top-[28px] left-[28px] h-[244px] w-[394px] rounded-2xl border-2 border-[#60A5FA] bg-[#DBEAFE] p-5 text-[#1E3A8A]"
        >
          <div class="flex items-center justify-between">
            <h2 class="font-mono text-[24px] leading-tight font-bold">lsblk</h2>
            <span class="rounded-lg bg-[#1D4ED8] px-3 py-1 text-[16px] font-bold text-white"
              >ブロックデバイス</span
            >
          </div>
          <div
            class="mt-5 rounded-xl bg-white px-5 py-4 font-mono text-[18px] leading-relaxed font-bold text-slate-800"
          >
            sda <span class="text-slate-500">(disk)</span><br />
            ├─sda1 <span class="text-slate-500">(part)</span> <span class="text-[#1D4ED8]">/</span
            ><br />
            ├─sda15 <span class="text-slate-500">(part)</span>
            <span class="text-[#1D4ED8]">/boot/efi</span><br />
            └─sda16 <span class="text-slate-500">(part)</span>
            <span class="text-[#1D4ED8]">/boot</span>
          </div>
        </article>

        <article
          class="absolute top-[28px] left-[478px] h-[244px] w-[394px] rounded-2xl border-2 border-[#2DD4BF] bg-[#CCFBF1] p-5 text-[#134E4A]"
        >
          <div class="flex items-center justify-between">
            <h2 class="font-mono text-[24px] leading-tight font-bold">findmnt</h2>
            <span class="rounded-lg bg-[#047857] px-3 py-1 text-[16px] font-bold text-white"
              >マウント</span
            >
          </div>
          <div
            class="mt-5 rounded-xl bg-white px-5 py-4 font-mono text-[17px] leading-relaxed font-bold text-slate-800"
          >
            / <span class="text-slate-500">←</span> /dev/sda1
            <span class="text-slate-500">ext4</span><br />
            /boot/efi <span class="text-slate-500">←</span> /dev/sda15
            <span class="text-slate-500">vfat</span><br />
            /boot <span class="text-slate-500">←</span> /dev/sda16
            <span class="text-slate-500">ext4</span><br />
            /proc <span class="text-slate-500">←</span> proc
            <span class="text-slate-500">proc</span>
          </div>
        </article>

        <div
          class="absolute top-[292px] left-[198px] rounded-lg bg-[#EDE9FE] px-3 py-1 text-[16px] font-bold text-[#4C1D95]"
        >
          <code>proc</code>はブロックデバイスではないため、通常は<code>lsblk</code>に現れない
        </div>
      </section>
    </main>
  </body>
</html>
